# Batch-collection config: 32 prompts x 8 trajectories = 256, hermes agent path
# (matches rl_train_entry: OHCodeActAgent is rebound to HermesOHCodeActAgent).
agent_cls: skyrl_agent.agents.oh_codeact.OHCodeActAgent   # registry key; rebound to hermes
task: skyrl_agent.tasks.swebench.utils.SWEBenchTask

tools:
  enable_bash_tool: true
  enable_browsing: false
  enable_llm_editor: false
  enable_editor: true
  enable_jupyter: false
  enable_cmd: true
  enable_think: true
  enable_finish: true
  enable_mcp: false
  enable_search: false

data:
  instance_key: instance
  instance_id_key: instance.instance_id
  data_source_key: data_source

generator:
  infer_backend: openai_server
  backend_config:
    model_name: ${oc.env:SMOKE_MODEL_NAME,sft}
    api_url: ${oc.env:SMOKE_API_URL,http://localhost:8010}
    model_max_len: 32768
  num_trajectories: 8            # 8 samples per prompt
  max_iterations: 30            # bounded (real=50); enough to expose degeneration
  max_prompt_length: 28000      # real per-turn token budget (agent caps max_tokens to this)
  sampling_params:
    temperature: 0.6            # the INTENDED setting (launcher CLI + smoke-validated)
    top_p: 0.95
    top_k: -1
    max_tokens: 4000
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: true
  qwen3_acc_thinking: true
  val_config:
    num_trajectories: 8
    sampling_params:
      temperature: 0.6
      top_p: 0.95
      top_k: -1
      max_tokens: 4000

dispatcher:
  type: async_pipeline
  scheduler: naive
  max_parallel_agents: 32       # conservative for the single remote-runtime server
  max_eval_parallel_agents: 32
  val_config:
    max_parallel_agents: 32
    max_eval_parallel_agents: 32
